     <link rel="manifest" href="Images/Logos/Icons/site.webmanifest">
     <script src="https://kit.fontawesome.com/0035514012.js" crossorigin="anonymous"></script>
     <title>Code Chronicles</title>

  <body id="home">
     <header class="nav">
         <script src="script/auth.js" defer></script>
         <nav aria-label="Primary">
          <label class="logo"><abbr title="Code Chronicles">&lt/&gtC.C</abbr></label>

      </header>
      <main class="main">
        <h1>Editor</h1>
        <p class="intro">Draft ideas, sketch code, and keep your notes in one place.</p>
      </main>
      <section class="section">
        <form class="editor" action="#" method="get">
            <label class="field">
              <span>Title</span>
              <input type="text" placeholder="Project title" name="title">
            </label>
            <label class="field">
              <span>Notes</span>
              <textarea name="edit" id="edit" cols="60" rows="18" placeholder="Start writing here"></textarea>
            </label>
            <div class="actions">
              <button type="button" class="btn ghost">Clear</button>
              <button type="submit" class="btn primary">Save Draft</button>
            </div>
        </form>
      </section>
      <footer class="footer">
          <ol>
            <li><a href="#home">Back on Top</a></li>

          <p class="watermark">Malko Labs</p>
      </footer>
  </body>
